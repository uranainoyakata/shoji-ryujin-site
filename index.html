<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>しょうじ｜瀬戸内龍神との接続者</title>
    <meta name="description" content="瀬戸内に宿る龍神との接続を司る、しょうじ。龍神からのメッセージを受け取り、あなたの運命を本来の流れへと導きます。">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'shrine-red': '#9e2e2b',
                        'shrine-gold': '#bfa668',
                        'shrine-dark': '#1a1a1a',
                        'shrine-paper': '#fbfaf5',
                        'shrine-gray': '#4a4a4a',
                        'dragon-blue': '#1e3a5f',
                        'dragon-cyan': '#4a9eff',
                        'ocean-teal': '#2d5f6f',
                    },
                    fontFamily: {
                        serif: ['"Shippori Mincho"', 'serif'],
                        calligraphy: ['"Kaisei Tokumin"', 'serif'],
                    },
                    animation: {
                        'fade-in-slow': 'fadeIn 2s ease-out forwards',
                        'slide-up': 'slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'dragon-swim': 'dragonSwim 30s linear infinite',
                        'dragon-swim-2': 'dragonSwim2 35s linear infinite',
                        'dragon-swim-3': 'dragonSwim3 40s linear infinite',
                        'wave-flow': 'waveFlow 8s ease-in-out infinite',
                        'sparkle': 'sparkle 3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        dragonSwim: {
                            '0%': {
                                transform: 'translate(-120%, 0) scale(0.8) rotate(0deg)',
                                opacity: '0'
                            },
                            '10%': {
                                transform: 'translate(-50%, -5%) scale(0.85) rotate(2deg)',
                                opacity: '0.4'
                            },
                            '30%': {
                                transform: 'translate(10%, -10%) scale(1) rotate(-3deg)',
                                opacity: '0.6'
                            },
                            '50%': {
                                transform: 'translate(50%, 5%) scale(0.95) rotate(2deg)',
                                opacity: '0.7'
                            },
                            '70%': {
                                transform: 'translate(90%, -8%) scale(0.9) rotate(-2deg)',
                                opacity: '0.5'
                            },
                            '90%': {
                                transform: 'translate(130%, 0%) scale(0.8) rotate(0deg)',
                                opacity: '0.2'
                            },
                            '100%': {
                                transform: 'translate(150%, 0) scale(0.8) rotate(0deg)',
                                opacity: '0'
                            }
                        },
                        dragonSwim2: {
                            '0%': {
                                transform: 'translate(150%, 10%) scale(0.7) rotate(0deg)',
                                opacity: '0'
                            },
                            '10%': {
                                transform: 'translate(120%, 8%) scale(0.75) rotate(-2deg)',
                                opacity: '0.3'
                            },
                            '30%': {
                                transform: 'translate(80%, 15%) scale(0.9) rotate(3deg)',
                                opacity: '0.5'
                            },
                            '50%': {
                                transform: 'translate(40%, 5%) scale(1) rotate(-2deg)',
                                opacity: '0.6'
                            },
                            '70%': {
                                transform: 'translate(10%, 12%) scale(0.85) rotate(2deg)',
                                opacity: '0.4'
                            },
                            '90%': {
                                transform: 'translate(-30%, 8%) scale(0.7) rotate(0deg)',
                                opacity: '0.2'
                            },
                            '100%': {
                                transform: 'translate(-50%, 10%) scale(0.7) rotate(0deg)',
                                opacity: '0'
                            }
                        },
                        dragonSwim3: {
                            '0%': {
                                transform: 'translate(-100%, 20%) scale(0.6) rotate(0deg)',
                                opacity: '0'
                            },
                            '15%': {
                                transform: 'translate(-20%, 18%) scale(0.7) rotate(3deg)',
                                opacity: '0.3'
                            },
                            '40%': {
                                transform: 'translate(30%, 25%) scale(0.85) rotate(-2deg)',
                                opacity: '0.5'
                            },
                            '60%': {
                                transform: 'translate(70%, 15%) scale(0.9) rotate(2deg)',
                                opacity: '0.6'
                            },
                            '85%': {
                                transform: 'translate(110%, 22%) scale(0.7) rotate(-1deg)',
                                opacity: '0.3'
                            },
                            '100%': {
                                transform: 'translate(140%, 20%) scale(0.6) rotate(0deg)',
                                opacity: '0'
                            }
                        },
                        waveFlow: {
                            '0%, 100%': { transform: 'translateX(0) translateY(0)' },
                            '50%': { transform: 'translateX(20px) translateY(-10px)' }
                        },
                        sparkle: {
                            '0%, 100%': { opacity: '0', transform: 'scale(0)' },
                            '50%': { opacity: '1', transform: 'scale(1)' }
                        }
                    },
                    backgroundImage: {
                        'gold-dust': "url(\"data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23bfa668' fill-opacity='0.15'%3E%3Ccircle cx='10' cy='10' r='1'/%3E%3Ccircle cx='40' cy='30' r='0.5'/%3E%3Ccircle cx='80' cy='60' r='1.5'/%3E%3Ccircle cx='20' cy='80' r='0.5'/%3E%3C/g%3E%3C/svg%3E\")",
                        'ocean-wave': "url(\"data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 50 Q 25 40, 50 50 T 100 50' stroke='%234a9eff' stroke-width='0.5' fill='none' opacity='0.1'/%3E%3Cpath d='M0 60 Q 25 50, 50 60 T 100 60' stroke='%232d5f6f' stroke-width='0.5' fill='none' opacity='0.1'/%3E%3C/svg%3E\")",
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Kaisei+Tokumin:wght@500;700;800&family=Zen+Old+Mincho:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --shrine-red: #9e2e2b;
            --shrine-gold: #bfa668;
            --paper: #fbfaf5;
            --dragon-blue: #1e3a5f;
            --ocean-teal: #2d5f6f;
        }

        body {
            font-family: 'Zen Old Mincho', 'Shippori Mincho', serif;
            background-color: var(--paper);
            color: #1a1a1a;
            overflow-x: hidden;
            line-height: 2.0;
        }

        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.12em;
        }

        @media (min-width: 768px) {
            .writing-vertical {
                letter-spacing: 0.15em;
            }
        }

        .washi-bg {
            background-color: #fbfaf5;
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
        }

        .shrine-border {
            position: relative;
            background: #fff;
            border: 1px solid #e5e5e5;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .shrine-border::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid var(--shrine-gold);
            pointer-events: none;
            opacity: 0.5;
        }

        .gold-text-effect {
            background: linear-gradient(45deg, #967e45, #d4c28d, #967e45);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(191, 166, 104, 0.2);
        }

        .dragon-text-effect {
            background: linear-gradient(135deg, #4a9eff, #2d5f6f, #4a9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(74, 158, 255, 0.4));
        }

        .kasumi-divider {
            height: 40px;
            background-image: radial-gradient(circle at center, var(--shrine-gold) 1px, transparent 1.5px);
            background-size: 8px 8px;
            opacity: 0.3;
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
        }

        .vermilion-stamp {
            border: 2px solid var(--shrine-red);
            color: var(--shrine-red);
            border-radius: 4px;
            padding: 0.2em 0.6em;
            display: inline-block;
            font-weight: bold;
            font-family: 'Kaisei Tokumin', serif;
        }

        .dragon-stamp {
            border: 2px solid var(--dragon-blue);
            color: var(--dragon-blue);
            border-radius: 4px;
            padding: 0.2em 0.6em;
            display: inline-block;
            font-weight: bold;
            font-family: 'Kaisei Tokumin', serif;
            background: linear-gradient(135deg, rgba(74, 158, 255, 0.1), rgba(45, 95, 111, 0.1));
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Dragon Animation */
        .dragon-container {
            position: absolute;
            width: 350px;
            height: 350px;
            pointer-events: none;
            filter: drop-shadow(0 0 30px rgba(74, 158, 255, 0.6));
            will-change: transform, opacity;
        }

        @media (max-width: 768px) {
            .dragon-container {
                width: 200px;
                height: 200px;
            }
        }

        /* Water ripple effect */
        .water-ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(74, 158, 255, 0.3);
            animation: ripple 4s ease-out infinite;
        }

        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 0.8;
            }

            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        @keyframes shimmy {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        /* Mapping shimmer to shimmy if name conflict or just defining it */
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        /* Sparkle particles */
        .sparkle-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #fff, #4a9eff);
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Background = () => {
            const [sparkles, setSparkles] = useState([]);

            useEffect(() => {
                const newSparkles = Array.from({ length: 30 }, (_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    top: Math.random() * 100,
                    delay: Math.random() * 3,
                }));
                setSparkles(newSparkles);
            }, []);

            return (
                <div className="fixed inset-0 pointer-events-none z-0 washi-bg">
                    <div className="absolute inset-0 bg-ocean-wave opacity-20"></div>
                    <div className="absolute inset-0 bg-gold-dust opacity-30"></div>

                    {/* Sparkle particles */}
                    {sparkles.map(sparkle => (
                        <div
                            key={sparkle.id}
                            className="sparkle-particle"
                            style={{
                                left: `${sparkle.left}%`,
                                top: `${sparkle.top}%`,
                                animationDelay: `${sparkle.delay}s`,
                            }}
                        />
                    ))}
                </div>
            );
        };

        const SectionPhoto = ({ src, alt }) => (
            <figure className="mt-6 md:mt-8 relative p-1 bg-white border border-shrine-gold/30 shadow-sm">
                <div className="aspect-[16/9] w-full relative">
                    <img src={src} alt={alt} className="h-full w-full object-cover" loading="lazy" />
                    <div className="absolute top-2 left-2 w-3 h-3 md:w-4 md:h-4 border-t border-l border-white/80"></div>
                    <div className="absolute top-2 right-2 w-3 h-3 md:w-4 md:h-4 border-t border-r border-white/80"></div>
                    <div className="absolute bottom-2 left-2 w-3 h-3 md:w-4 md:h-4 border-b border-l border-white/80"></div>
                    <div className="absolute bottom-2 right-2 w-3 h-3 md:w-4 md:h-4 border-b border-r border-white/80"></div>
                </div>
            </figure>
        );

        const CollapsibleDescription = ({ children }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="mt-5 md:mt-6 w-full flex flex-col items-start">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="group flex items-center gap-3 text-sm md:text-base text-shrine-dark font-bold border-b border-shrine-gold/50 pb-1 hover:text-dragon-cyan transition-colors"
                    >
                        <span className={`w-2 h-2 bg-dragon-cyan transform rotate-45 transition-transform duration-300 ${isOpen ? 'rotate-0' : ''}`}></span>
                        {isOpen ? '詳細を閉じる' : '詳細を拝見する'}
                    </button>
                    <div className={`w-full grid transition-[grid-template-rows] duration-500 ease-out ${isOpen ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}`}>
                        <div className="overflow-hidden">
                            <div className="pt-4 pb-2 text-sm md:text-base leading-loose text-justify text-shrine-gray">
                                {children}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Greeting = () => (
            <div className="w-full relative z-10 pt-28 pb-16 md:pt-40 md:pb-24 px-5 text-center">
                <div className="flex flex-col items-center justify-center gap-8 md:gap-12 animate-fade-in-slow">
                    <h2 className="text-3xl md:text-5xl font-bold font-calligraphy text-shrine-dark leading-relaxed tracking-widest drop-shadow-sm">
                        <span className="block mb-4 md:mb-6">ご縁に感謝します</span>
                        <span className="block text-2xl md:text-4xl text-shrine-gray">
                            <span className="dragon-text-effect">龍神</span>、瀬戸内、<br className="md:hidden" />しょうじです
                        </span>
                    </h2>
                    <div className="w-16 h-[2px] bg-gradient-to-r from-transparent via-shrine-gold to-transparent opacity-70"></div>
                </div>
            </div>
        );

        const App = () => {
            const [view, setView] = useState('start'); // 'start', 'menu'
            const itemsRef = useRef([]);

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('animate-slide-up');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                // Delay observation slightly to allow DOM to settle
                setTimeout(() => {
                    itemsRef.current.forEach(el => el && observer.observe(el));
                }, 100);
            }, [view]);

            const addToRefs = (el) => {
                if (el && !itemsRef.current.includes(el)) itemsRef.current.push(el);
            };

            const handleEnterContent = (viewTarget = 'start') => {
                setView('transition');
                setTimeout(() => {
                    window.scrollTo({ top: 0, behavior: 'instant' });
                    setView(viewTarget);
                }, 500); // Wait for fade out
            };

            return (
                <React.Fragment>

                    <div className="min-h-screen w-full relative overflow-hidden">
                        <Background />

                        {/* ==================== CONTENT START VIEW (Profile + Philosophy) ==================== */}
                        <div className={`transition-all duration-500 ease-in-out absolute w-full top-0 left-0 ${view === 'start' ? 'opacity-100 z-20 relative' : 'opacity-0 z-0 pointer-events-none absolute'}`}>



                            {/* --- Greeting --- */}
                            <Greeting />

                            {/* --- Authority Top Banner (TV Topic Style) --- */}
                            <section className="relative z-20 max-w-4xl mx-auto px-5 -mt-8 mb-16 md:mb-20">
                                <div ref={addToRefs} className="opacity-0 transform translate-y-4 transition-all duration-1000 delay-300">
                                    <div className="text-center relative">

                                        {/* "Topic on YouTube" Label */}
                                        <div className="inline-block bg-shrine-dark text-shrine-gold px-6 py-2 text-xs md:text-sm font-bold tracking-widest mb-4 shadow-lg border border-shrine-gold/50 relative z-10">
                                            YouTube『しょうじ幸運伝道』で話題
                                        </div>

                                        {/* Main Title Block */}
                                        <h1 className="text-2xl md:text-4xl font-bold font-calligraphy text-shrine-dark mb-3 drop-shadow-sm leading-snug">
                                            しょうじのYouTubeチャンネル
                                        </h1>

                                        {/* Subtitle */}
                                        <div className="text-sm md:text-base text-shrine-gray font-bold tracking-widest mb-8 border-b border-dragon-cyan/30 inline-block pb-1">
                                            最新動画はこちら
                                        </div>

                                        {/* Stats & Video Container */}
                                        <div className="bg-white border-2 border-shrine-gold/30 p-2 md:p-4 shadow-2xl relative overflow-hidden rounded-xl">

                                            {/* "1M Views" Badge Overlay (Top Left) */}
                                            <div className="absolute -top-2 -left-2 z-20 bg-gradient-to-br from-red-600 to-red-800 text-white rounded-br-2xl px-5 py-3 shadow-[0_4px_10px_rgba(200,0,0,0.4)] border-t border-l border-white/20">
                                                <span className="block text-[10px] opacity-90 tracking-widest mb-1">総再生回数</span>
                                                <span className="block text-2xl md:text-3xl font-oswald font-bold leading-none tracking-tighter">100<span className="text-sm ml-1">万回突破</span></span>
                                            </div>

                                            {/* Video Thumbnail with Pulse Glow */}
                                            <div className="relative aspect-video bg-black rounded-lg overflow-hidden shadow-inner group/video cursor-pointer border border-shrine-dark/10">
                                                <img
                                                    src="https://img.youtube.com/vi/qRoIQgQdbxA/hqdefault.jpg"
                                                    alt="Youtube Thumbnail"
                                                    className="absolute inset-0 w-full h-full object-cover opacity-90 group-hover/video:opacity-100 transition-opacity duration-500"
                                                />
                                                <div className="absolute inset-0 bg-black/20 group-hover/video:bg-transparent transition-colors"></div>

                                                {/* Play Button */}
                                                <a
                                                    href="https://www.youtube.com/watch?v=qRoIQgQdbxA"
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="absolute inset-0 flex items-center justify-center z-10"
                                                >
                                                    <div className="w-16 h-16 md:w-20 md:h-20 bg-red-600/90 rounded-full flex items-center justify-center shadow-lg group-hover/video:scale-110 transition-transform duration-300 ring-4 ring-red-600/30">
                                                        <svg className="w-8 h-8 md:w-10 md:h-10 text-white fill-current ml-1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
                                                    </div>
                                                </a>

                                                <div className="absolute bottom-3 right-3 bg-black/70 text-white text-[10px] px-2 py-1 rounded">
                                                    公式映像
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {/* --- Profile (Self-Intro) --- */}
                            <section className="relative z-10 max-w-4xl mx-auto px-5 mb-24 md:mb-32">
                                <div ref={addToRefs} className="shrine-border p-6 md:p-12 mb-16 md:mb-20 opacity-0 transform translate-y-8 transition-all duration-1000 bg-white/80 backdrop-blur-sm">
                                    <div className="flex flex-col md:flex-row gap-8 md:gap-16 items-center md:items-start">
                                        <div className="w-48 h-64 md:w-72 md:h-96 shrink-0 relative bg-shrine-gray shadow-xl rotate-1">
                                            <img src="https://i.ibb.co/TMGHVgRm/image.jpg" alt="しょうじ" className="w-full h-full object-cover grayscale-[20%] sepia-[10%] contrast-110" />
                                            <div className="absolute -top-3 -left-3 w-8 h-8 border-t-2 border-l-2 border-shrine-gold"></div>
                                            <div className="absolute -bottom-3 -right-3 w-8 h-8 border-b-2 border-r-2 border-shrine-gold"></div>
                                            <div className="absolute bottom-4 right-4 writing-vertical text-white text-xs font-bold tracking-widest drop-shadow-md opacity-80">
                                                瀬戸内にて
                                            </div>
                                        </div>

                                        <div className="flex-1 pt-2 md:pt-4">
                                            <h2 className="text-2xl md:text-4xl font-bold mb-6 md:mb-8 font-calligraphy text-shrine-dark">
                                                <span className="block text-sm md:text-base text-dragon-cyan tracking-widest mb-2 font-serif">龍神接続者</span>
                                                しょうじ
                                            </h2>

                                            <div className="space-y-6 md:space-y-8 text-sm md:text-base leading-loose font-serif text-shrine-dark text-justify">
                                                <p>
                                                    はじめまして。瀬戸内の海と島々に囲まれた地で、<br className="hidden md:inline" />龍神様との「接続」を司る役目を担っております。
                                                </p>
                                                <p>
                                                    私の元には、人生の荒波に揉まれ、本来の自分を見失ってしまった方々が多く訪れます。<br />
                                                    「頑張っているのに報われない」<br />
                                                    「なぜか運気が滞っている気がする」<br />
                                                    それは、貴方の魂が「本来流れるべき川」から外れてしまっているからかもしれません。
                                                </p>
                                                <p>
                                                    私は「視る」だけではありません。<br />
                                                    貴方の魂を、強大な龍神のエネルギーと再び<strong className="text-dragon-cyan font-bold border-b border-dragon-cyan/30 mx-1">「接続（コネクト）」</strong>させます。<br />
                                                    パイプが繋がれば、水が流れるように、運命は自然と動き出します。
                                                </p>
                                                <p className="text-shrine-gray/80 italic">
                                                    「見えない世界」を味方につけ、「見える現実」を動かす。<br />
                                                    そのお手伝いをさせてください。
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
