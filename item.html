<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>龍神波動アイテム｜しょうじ</title>
    <meta name="description" content="瀬戸内に宿る龍神との接続を司る、しょうじ。龍神からのメッセージを受け取り、あなたの運命を本来の流れへと導きます。">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'shrine-red': '#9e2e2b',
                        'shrine-gold': '#bfa668',
                        'shrine-dark': '#1a1a1a',
                        'shrine-paper': '#fbfaf5',
                        'shrine-gray': '#4a4a4a',
                        'dragon-blue': '#1e3a5f',
                        'dragon-cyan': '#4a9eff',
                        'ocean-teal': '#2d5f6f',
                    },
                    fontFamily: {
                        serif: ['"Shippori Mincho"', 'serif'],
                        calligraphy: ['"Kaisei Tokumin"', 'serif'],
                    },
                    animation: {
                        'fade-in-slow': 'fadeIn 2s ease-out forwards',
                        'slide-up': 'slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'dragon-swim': 'dragonSwim 30s linear infinite',
                        'dragon-swim-2': 'dragonSwim2 35s linear infinite',
                        'dragon-swim-3': 'dragonSwim3 40s linear infinite',
                        'wave-flow': 'waveFlow 8s ease-in-out infinite',
                        'sparkle': 'sparkle 3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        dragonSwim: {
                            '0%': {
                                transform: 'translate(-120%, 0) scale(0.8) rotate(0deg)',
                                opacity: '0'
                            },
                            '10%': {
                                transform: 'translate(-50%, -5%) scale(0.85) rotate(2deg)',
                                opacity: '0.4'
                            },
                            '30%': {
                                transform: 'translate(10%, -10%) scale(1) rotate(-3deg)',
                                opacity: '0.6'
                            },
                            '50%': {
                                transform: 'translate(50%, 5%) scale(0.95) rotate(2deg)',
                                opacity: '0.7'
                            },
                            '70%': {
                                transform: 'translate(90%, -8%) scale(0.9) rotate(-2deg)',
                                opacity: '0.5'
                            },
                            '90%': {
                                transform: 'translate(130%, 0%) scale(0.8) rotate(0deg)',
                                opacity: '0.2'
                            },
                            '100%': {
                                transform: 'translate(150%, 0) scale(0.8) rotate(0deg)',
                                opacity: '0'
                            }
                        },
                        dragonSwim2: {
                            '0%': {
                                transform: 'translate(150%, 10%) scale(0.7) rotate(0deg)',
                                opacity: '0'
                            },
                            '10%': {
                                transform: 'translate(120%, 8%) scale(0.75) rotate(-2deg)',
                                opacity: '0.3'
                            },
                            '30%': {
                                transform: 'translate(80%, 15%) scale(0.9) rotate(3deg)',
                                opacity: '0.5'
                            },
                            '50%': {
                                transform: 'translate(40%, 5%) scale(1) rotate(-2deg)',
                                opacity: '0.6'
                            },
                            '70%': {
                                transform: 'translate(10%, 12%) scale(0.85) rotate(2deg)',
                                opacity: '0.4'
                            },
                            '90%': {
                                transform: 'translate(-30%, 8%) scale(0.7) rotate(0deg)',
                                opacity: '0.2'
                            },
                            '100%': {
                                transform: 'translate(-50%, 10%) scale(0.7) rotate(0deg)',
                                opacity: '0'
                            }
                        },
                        dragonSwim3: {
                            '0%': {
                                transform: 'translate(-100%, 20%) scale(0.6) rotate(0deg)',
                                opacity: '0'
                            },
                            '15%': {
                                transform: 'translate(-20%, 18%) scale(0.7) rotate(3deg)',
                                opacity: '0.3'
                            },
                            '40%': {
                                transform: 'translate(30%, 25%) scale(0.85) rotate(-2deg)',
                                opacity: '0.5'
                            },
                            '60%': {
                                transform: 'translate(70%, 15%) scale(0.9) rotate(2deg)',
                                opacity: '0.6'
                            },
                            '85%': {
                                transform: 'translate(110%, 22%) scale(0.7) rotate(-1deg)',
                                opacity: '0.3'
                            },
                            '100%': {
                                transform: 'translate(140%, 20%) scale(0.6) rotate(0deg)',
                                opacity: '0'
                            }
                        },
                        waveFlow: {
                            '0%, 100%': { transform: 'translateX(0) translateY(0)' },
                            '50%': { transform: 'translateX(20px) translateY(-10px)' }
                        },
                        sparkle: {
                            '0%, 100%': { opacity: '0', transform: 'scale(0)' },
                            '50%': { opacity: '1', transform: 'scale(1)' }
                        }
                    },
                    backgroundImage: {
                        'gold-dust': "url(\"data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23bfa668' fill-opacity='0.15'%3E%3Ccircle cx='10' cy='10' r='1'/%3E%3Ccircle cx='40' cy='30' r='0.5'/%3E%3Ccircle cx='80' cy='60' r='1.5'/%3E%3Ccircle cx='20' cy='80' r='0.5'/%3E%3C/g%3E%3C/svg%3E\")",
                        'ocean-wave': "url(\"data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 50 Q 25 40, 50 50 T 100 50' stroke='%234a9eff' stroke-width='0.5' fill='none' opacity='0.1'/%3E%3Cpath d='M0 60 Q 25 50, 50 60 T 100 60' stroke='%232d5f6f' stroke-width='0.5' fill='none' opacity='0.1'/%3E%3C/svg%3E\")",
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Kaisei+Tokumin:wght@500;700;800&family=Zen+Old+Mincho:wght@400;700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --shrine-red: #9e2e2b;
            --shrine-gold: #bfa668;
            --paper: #fbfaf5;
            --dragon-blue: #1e3a5f;
            --ocean-teal: #2d5f6f;
        }

        body {
            font-family: 'Zen Old Mincho', 'Shippori Mincho', serif;
            background-color: var(--paper);
            color: #1a1a1a;
            overflow-x: hidden;
            line-height: 2.0;
        }

        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.12em;
        }

        @media (min-width: 768px) {
            .writing-vertical {
                letter-spacing: 0.15em;
            }
        }

        .washi-bg {
            background-color: #fbfaf5;
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
        }

        .shrine-border {
            position: relative;
            background: #fff;
            border: 1px solid #e5e5e5;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .shrine-border::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid var(--shrine-gold);
            pointer-events: none;
            opacity: 0.5;
        }

        .gold-text-effect {
            background: linear-gradient(45deg, #967e45, #d4c28d, #967e45);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(191, 166, 104, 0.2);
        }

        .dragon-text-effect {
            background: linear-gradient(135deg, #4a9eff, #2d5f6f, #4a9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 8px rgba(74, 158, 255, 0.4));
        }

        .kasumi-divider {
            height: 40px;
            background-image: radial-gradient(circle at center, var(--shrine-gold) 1px, transparent 1.5px);
            background-size: 8px 8px;
            opacity: 0.3;
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
        }

        .vermilion-stamp {
            border: 2px solid var(--shrine-red);
            color: var(--shrine-red);
            border-radius: 4px;
            padding: 0.2em 0.6em;
            display: inline-block;
            font-weight: bold;
            font-family: 'Kaisei Tokumin', serif;
        }

        .dragon-stamp {
            border: 2px solid var(--dragon-blue);
            color: var(--dragon-blue);
            border-radius: 4px;
            padding: 0.2em 0.6em;
            display: inline-block;
            font-weight: bold;
            font-family: 'Kaisei Tokumin', serif;
            background: linear-gradient(135deg, rgba(74, 158, 255, 0.1), rgba(45, 95, 111, 0.1));
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Dragon Animation */
        .dragon-container {
            position: absolute;
            width: 350px;
            height: 350px;
            pointer-events: none;
            filter: drop-shadow(0 0 30px rgba(74, 158, 255, 0.6));
            will-change: transform, opacity;
        }

        @media (max-width: 768px) {
            .dragon-container {
                width: 200px;
                height: 200px;
            }
        }

        /* Water ripple effect */
        .water-ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(74, 158, 255, 0.3);
            animation: ripple 4s ease-out infinite;
        }

        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 0.8;
            }

            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        /* Sparkle particles */
        .sparkle-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #fff, #4a9eff);
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Background = () => {
            const [sparkles, setSparkles] = useState([]);

            useEffect(() => {
                const newSparkles = Array.from({ length: 30 }, (_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    top: Math.random() * 100,
                    delay: Math.random() * 3,
                }));
                setSparkles(newSparkles);
            }, []);

            return (
                <div className="fixed inset-0 pointer-events-none z-0 washi-bg">
                    <div className="absolute inset-0 bg-ocean-wave opacity-20"></div>
                    <div className="absolute inset-0 bg-gold-dust opacity-30"></div>

                    {/* Sparkle particles */}
                    {sparkles.map(sparkle => (
                        <div
                            key={sparkle.id}
                            className="sparkle-particle"
                            style={{
                                left: `${sparkle.left}%`,
                                top: `${sparkle.top}%`,
                                animationDelay: `${sparkle.delay}s`,
                            }}
                        />
                    ))}
                </div>
            );
        };



        const SectionPhoto = ({ src, alt }) => (
            <figure className="mt-6 md:mt-8 relative p-1 bg-white border border-shrine-gold/30 shadow-sm">
                <div className="aspect-[16/9] w-full relative">
                    <img src={src} alt={alt} className="h-full w-full object-cover" loading="lazy" />
                    <div className="absolute top-2 left-2 w-3 h-3 md:w-4 md:h-4 border-t border-l border-white/80"></div>
                    <div className="absolute top-2 right-2 w-3 h-3 md:w-4 md:h-4 border-t border-r border-white/80"></div>
                    <div className="absolute bottom-2 left-2 w-3 h-3 md:w-4 md:h-4 border-b border-l border-white/80"></div>
                    <div className="absolute bottom-2 right-2 w-3 h-3 md:w-4 md:h-4 border-b border-r border-white/80"></div>
                </div>
            </figure>
        );

        const CollapsibleDescription = ({ children }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="mt-5 md:mt-6 w-full flex flex-col items-start">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="group flex items-center gap-3 text-sm md:text-base text-shrine-dark font-bold border-b border-shrine-gold/50 pb-1 hover:text-dragon-cyan transition-colors"
                    >
                        <span className={`w-2 h-2 bg-dragon-cyan transform rotate-45 transition-transform duration-300 ${isOpen ? 'rotate-0' : ''}`}></span>
                        {isOpen ? '詳細を閉じる' : '詳細を拝見する'}
                    </button>
                    <div className={`w-full grid transition-[grid-template-rows] duration-500 ease-out ${isOpen ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}`}>
                        <div className="overflow-hidden">
                            <div className="pt-4 pb-2 text-sm md:text-base leading-loose text-justify text-shrine-gray">
                                {children}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const itemsRef = React.useRef([]);
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('animate-slide-up');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                // Delay observation slightly to allow DOM to settle
                setTimeout(() => {
                    itemsRef.current.forEach(el => el && observer.observe(el));
                }, 100);
            }, []);

            const addToRefs = (el) => {
                if (el && !itemsRef.current.includes(el)) itemsRef.current.push(el);
            };

            return (
                <React.Fragment>

                    <div className="min-h-screen w-full relative overflow-hidden">
                        <Background />

                        {/* --- Header --- */}
                        <header className="relative z-10 w-full flex flex-col items-center pt-16 pb-16 md:pt-28 md:pb-32 px-5">

                            {/* ロゴ: 龍神モチーフ */}
                            <div className="mb-8 md:mb-12 opacity-80 animate-fade-in-slow transform scale-90 md:scale-100">
                                <svg width="80" height="80" viewBox="0 0 100 100" className="stroke-dragon-blue fill-none stroke-[1.5]">
                                    <circle cx="50" cy="50" r="40" className="stroke-dragon-cyan" />
                                    <path d="M50 10 L50 90 M10 50 L90 50" className="stroke-ocean-teal/30" />
                                    <circle cx="50" cy="50" r="25" className="stroke-shrine-gold" />
                                    <path d="M 30 50 Q 40 40, 50 50 T 70 50" className="stroke-dragon-blue stroke-[2]" />
                                </svg>
                            </div>

                            {/* キャッチコピーエリア - Subpage Header */}
                            <div className="max-w-4xl w-full flex flex-col items-center justify-center gap-6 mt-8 mb-16">
                                <h1 className="text-3xl md:text-5xl font-bold font-calligraphy tracking-widest text-shrine-dark drop-shadow-sm text-center">
                                    <span className="dragon-text-effect">龍神波動アイテム</span>
                                </h1>
                                <div className="w-16 h-[2px] bg-gradient-to-r from-transparent via-shrine-gold to-transparent"></div>
                                <p className="font-serif text-shrine-gray text-sm md:text-base tracking-widest text-center">
                                    龍神の息吹を、あなたの日常へ
                                </p>
                            </div>
                        </header>



                        {/* --- Menu Index --- */}
                        <section className="relative z-10 max-w-5xl mx-auto px-5 pb-32 md:pb-40 space-y-20 md:space-y-24">

                            {/* 02 アイテム - Detailed View */}
                            <article ref={addToRefs} className="opacity-0">
                                <div className="flex flex-col md:flex-row gap-8 md:gap-16 mb-12">
                                    <div className="md:w-1/2">
                                        <SectionPhoto src="https://i.ibb.co/CsX7GNd0/Gemini-Generated-Image-hxuemwhxuemwhxue.jpg" alt="龍神アイテム" />
                                    </div>
                                    <div className="md:w-1/2 flex flex-col justify-center">
                                        <h2 className="text-2xl md:text-3xl font-bold font-calligraphy text-shrine-dark mb-6">
                                            <span className="border-b-2 border-dragon-cyan pb-2">波動アイテムについて</span>
                                        </h2>
                                        <p className="text-shrine-gray text-base leading-loose font-serif text-justify">
                                            龍神のエネルギーは、物質に宿すことでその効力を永続的に保つことができます。<br /><br />
                                            あなたの波動と龍神の波動が最も共鳴する素材を選定し、しょうじが31時間かけて「接続」の儀を行います。<br />
                                            ブレスレット、首飾り、あるいはお守り。あなたの生活に最も馴染む形でお届けする、世界に一つだけの守護具です。
                                        </p>
                                    </div>
                                </div>

                                <div className="bg-white/70 p-8 md:p-12 border border-dragon-cyan/30 rounded-sm shadow-sm relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10">
                                        <svg width="150" height="150" viewBox="0 0 100 100" className="stroke-dragon-blue fill-none stroke-[1]">
                                            <circle cx="50" cy="50" r="40" />
                                            <path d="M50 10 L50 90 M10 50 L90 50" />
                                        </svg>
                                    </div>

                                    <h3 className="text-center font-calligraphy text-xl font-bold mb-8 text-dragon-blue">授与品一覧</h3>

                                    <div className="border-b border-dashed border-shrine-gold/50 pb-6 mb-6">
                                        <div className="flex flex-col md:flex-row justify-between items-baseline mb-2">
                                            <h4 className="text-lg font-bold text-shrine-dark">龍神接続・波動封入守護具（オーダーメイド）</h4>
                                            <span className="text-xl font-bold text-dragon-cyan">120,000円〜</span>
                                        </div>
                                        <p className="text-shrine-gray text-sm">
                                            カウンセリングを行った上で、最適な素材（天然石、木材、貴金属など）を選定し制作いたします。<br />
                                            制作期間として、約1ヶ月〜2ヶ月のお時間を頂戴いたします。
                                        </p>
                                    </div>

                                    <p className="text-xs text-shrine-red text-center mt-4">
                                        ※ 現在、制作待ちが発生しており、お届けまでにお時間をいただいております。
                                    </p>
                                </div>

                                <div className="mt-16 text-center">
                                    <a href="index.html" className="inline-flex items-center gap-2 text-shrine-gray hover:text-dragon-cyan transition-colors font-serif text-sm tracking-widest border-b border-transparent hover:border-dragon-cyan pb-1">
                                        <span>←</span>
                                        <span>一覧へ戻る</span>
                                    </a>
                                </div>
                            </article>

                            {/* LINE CTA */}
                            <div id="line" ref={addToRefs} className="opacity-0 translate-y-8 mt-16 md:mt-20">
                                <div className="shrine-border p-8 md:p-16 text-center relative overflow-hidden">
                                    <div className="relative z-10">
                                        <h3 className="text-xl md:text-3xl font-bold font-calligraphy mb-4 md:mb-6">
                                            <span className="dragon-text-effect">お申し込み・お問い合わせ</span>
                                        </h3>
                                        <p className="text-sm md:text-base leading-loose mb-8 md:mb-10 text-shrine-gray">
                                            龍神接続のお申し込みは、<br className="md:hidden" />公式LINEにて承ります。<br />
                                            ご希望のメニュー名を添えて、<br className="md:hidden" />静かに一言お送りください。
                                        </p>

                                        <a
                                            href="https://lin.ee/LB2rF3Z"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="inline-flex items-center justify-center gap-3 w-full md:w-auto px-8 md:px-10 py-4 md:py-5 bg-gradient-to-r from-dragon-blue to-ocean-teal text-white hover:from-ocean-teal hover:to-dragon-blue transition-all shadow-lg rounded-sm"
                                        >
                                            <span className="tracking-widest font-bold text-base md:text-lg">公式LINEへ</span>
                                            <span className="text-sm">→</span>
                                        </a>

                                        <p className="mt-6 md:mt-8 text-[10px] md:text-xs text-dragon-cyan tracking-widest">OFFICIAL LINE ACCOUNT</p>
                                    </div>
                                </div>
                            </div>

                        </section>

                        {/* --- Footer --- */}
                        <footer className="py-16 md:py-20 bg-gradient-to-b from-dragon-blue to-shrine-dark text-shrine-paper text-center relative z-10">
                            <div className="flex flex-col items-center justify-center space-y-6 md:space-y-8">
                                <div className="w-[1px] h-12 md:h-16 bg-dragon-cyan opacity-30"></div>
                                <div className="font-calligraphy text-xl md:text-2xl tracking-[0.2em]">
                                    <span className="dragon-text-effect">龍神接続</span>
                                </div>
                                <p className="text-[10px] md:text-xs font-serif tracking-widest opacity-60 leading-loose">
                                    龍神との繋がりが<br />
                                    あなたを導く
                                </p>
                                <div className="text-[10px] tracking-widest opacity-30 pt-6">
                                    © Shoji Dragon God Reading.
                                </div>
                            </div>
                        </footer>

                    </div>
                </React.Fragment>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
